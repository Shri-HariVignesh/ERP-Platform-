spring.application.name=campusos-student-portal
server.port=8080

spring.datasource.url=jdbc:h2:mem:campusos;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# SECURITY: the H2 console is an unauthenticated read/write window onto every tenant's
# data and bypasses all tenant+student scoping. It must never be reachable.
spring.h2.console.enabled=false

# SECURITY: SameSite=Lax stops the session cookie riding along on cross-site POSTs,
# which is the CSRF vector for every state-changing form in this prototype.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# SECURITY: never echo stack traces or internal messages to the client.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

spring.thymeleaf.cache=false
logging.level.org.hibernate.SQL=warn
