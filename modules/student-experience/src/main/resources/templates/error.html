<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'CampusOS · ' + ${status} + ' ' + ${error}">CampusOS · Error</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="loginpage">
<main class="loginbox">
  <h1 th:text="${status} + ' · ' + ${error}">Error</h1>
  <p class="sub" th:text="${message != null and !#strings.isEmpty(message) ? message : 'Something went wrong handling that request.'}">
    Something went wrong handling that request.
  </p>

  <p class="fineprint"><a href="/">← Student portal</a> &nbsp;·&nbsp; <a href="/login">Staff sign in</a></p>
</main>
</body>
</html>
