<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'CampusOS · ' + ${title}">CampusOS</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<header th:fragment="header" class="topbar">
  <div class="wrap bar">
    <a class="brand" th:href="@{/}">
      <span class="mark" th:text="${tenant.shortName}">SNIT</span>
      <span>
        <strong th:text="${tenant.name}">Institute</strong>
        <small th:text="${tenant.city}">City</small>
      </span>
    </a>

    <!--/*
      This slot used to hold the identity switcher: a dropdown of every seeded student that
      POSTed a studentId to /switch, which then WROTE the session Scope. It was the student
      equivalent of the retired /sim hook — the last place the client chose whose data it saw.
      It is gone, and so is /switch. Who you are is now who you logged in as.
    */-->
    <form class="switcher" th:action="@{/logout}" method="post">
      <label th:text="${student.name} + ' · ' + ${student.rollNo}">Signed in</label>
      <button class="btn ghost" type="submit">Sign out</button>
    </form>
  </div>

  <nav class="wrap tabs">
    <a th:href="@{/}"           th:classappend="${nav=='home'}       ? 'on'">Home</a>
    <a th:href="@{/requests}"   th:classappend="${nav=='requests'}   ? 'on'">My Requests</a>
    <a th:href="@{/leave}"      th:classappend="${nav=='leave'}      ? 'on'">Leave</a>
    <a th:href="@{/internship}" th:classappend="${nav=='internship'} ? 'on'">Internship</a>
    <a th:href="@{/documents}"  th:classappend="${nav=='documents'}  ? 'on'">Documents</a>
    <a th:href="@{/academic}"   th:classappend="${nav=='academic'}   ? 'on'">Academic</a>
    <a th:href="@{/grievance}"  th:classappend="${nav=='grievance'}  ? 'on'">Grievance</a>

  </nav>
</header>

<div th:fragment="flash">
  <p class="flash ok"   th:if="${flash}" th:text="${flash}"></p>
  <p class="flash bad"  th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>
