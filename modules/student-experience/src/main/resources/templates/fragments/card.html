<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  THE shared request card. Consumes only the normalized RequestCard.
  There is no th:if on request type anywhere in this file — that is the point.
-->
<article th:fragment="card(c, back)" class="card">

  <div class="card-top">
    <div>
      <span class="kind" th:text="${c.typeLabel}">Type</span>
      <h3 th:text="${c.title}">Title</h3>
      <p class="sub" th:text="${c.subtitle}">Subtitle</p>
    </div>
    <span th:class="'badge ' + ${c.badgeTone}" th:text="${c.stateLabel}">State</span>
  </div>

  <p class="headline" th:text="${c.headline}">Headline</p>

  <div th:replace="~{fragments/timeline :: timeline(${c.steps})}"></div>

  <ul class="artifacts" th:if="${!c.artifacts.isEmpty()}">
    <li th:each="a : ${c.artifacts}">
      <span th:text="${a.label}">Label</span>
      <a th:if="${a.href != null}" th:href="${a.href}" th:text="${a.value}">value</a>
      <strong th:if="${a.href == null}" th:text="${a.value}">value</strong>
    </li>
  </ul>

  <!-- conditional student action: rendered only when the matrix offers one -->
  <form th:if="${c.studentAction != null}" class="act student"
        th:action="@{'/actions/' + ${c.id}}" method="post">
    <input type="hidden" name="event" th:value="${c.studentAction.event}">
    <input type="hidden" name="back" th:value="${back}">
    <input th:if="${c.studentAction.inputLabel != null}" type="text" name="input" required
           th:placeholder="${c.studentAction.inputLabel}">
    <textarea th:if="${c.studentAction.requiresNote}" name="note" required placeholder="Add a note"></textarea>
    <button type="submit" th:class="'btn ' + ${c.studentAction.tone}"
            th:text="${c.studentAction.label}">Act</button>
  </form>

  <!-- Closed on load: a student sees the clean card, and opens this only if they want the detail. -->
  <details class="trail">
    <summary>
      See what happened
      <span th:text="'· ' + ${c.trail.size()} + ' steps · updated ' + ${c.updatedAt}"></span>
    </summary>

    <ol class="hist">
      <li th:each="h : ${c.trail}">
        <span class="step" th:text="${h.transition}">step</span>
        <span class="who" th:text="${h.actor}">actor</span>
        <span class="when" th:text="${h.at}">when</span>
        <p class="note" th:if="${h.hasNote()}" th:text="'“' + ${h.note} + '”'"></p>
        <p class="fx" th:if="${h.hasEffects()}" th:text="${h.effects}"></p>
        <p class="proof" th:if="${h.hasProof()}" th:text="${h.proof}"></p>
      </li>
    </ol>

    <!--/*
      The demo hook that used to live here is gone. It rendered a form per staff action with
      the ACTOR in a hidden field, and posted it to /sim — the last place in the application
      where the client told the server who it was acting as.

      Staff decisions now happen on the staff surface (/faculty), where the actor is derived
      from the authenticated principal and never travels in a form.
    */-->
  </details>

</article>

</body>
</html>
