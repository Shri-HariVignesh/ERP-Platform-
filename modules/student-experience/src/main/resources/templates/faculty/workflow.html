<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{faculty/layout :: head(${workflow})}"></head>
<body>
<header th:replace="~{faculty/layout :: header}"></header>

<main class="wrap">
  <div th:replace="~{faculty/layout :: flash}"></div>

  <section class="hero">
    <h1 th:text="${workflow}">Workflow</h1>
    <p class="sub">The same inbox, narrowed to one workflow. The buttons come from the frozen
      transition matrix intersected with your roles, so you are only ever offered a move that
      is genuinely yours to make at this stage.</p>
  </section>

  <div class="cards">
    <th:block th:each="t : ${tasks}">
      <div th:replace="~{faculty/task :: task(${t}, ${back})}"></div>
    </th:block>
  </div>
  <p class="empty" th:if="${tasks.isEmpty()}"
     th:text="'No ' + ${workflow.toLowerCase()} + ' request is waiting on you.'">None</p>
</main>
</body>
</html>
