<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Requests')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="wrap">
  <div th:replace="~{fragments/layout :: flash}"></div>

  <section class="hero">
    <h1>My Requests</h1>
    <p class="sub">Every request type, one tracker, one timeline. All four workflows are rows in
      the same table and render through the same card.</p>
  </section>

  <nav class="filters">
    <a th:href="@{/requests}" th:classappend="${filter=='ALL'} ? 'on'">All</a>
    <a th:each="t : ${types}" th:href="@{/requests(filter=${t})}"
       th:classappend="${filter==t.name()} ? 'on'"
       th:text="${T(com.campusos.portal.view.DisplayLabels).type(t)}">Type</a>
  </nav>

  <div class="cards">
    <th:block th:each="c : ${cards}">
        <div th:replace="~{fragments/card :: card(${c}, '/requests')}"></div>
      </th:block>
  </div>
  <p class="empty" th:if="${cards.isEmpty()}">No requests of this type yet.</p>
</main>
</body>
</html>
